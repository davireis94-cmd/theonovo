<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Copa do Theo — Lista de confirmações</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23fff' stroke='%230f2740' stroke-width='5'/%3E%3Cpolygon points='32,19 44,28 40,42 24,42 20,28' fill='%230f2740'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --grama:#1f7a3c; --grama-2:#176331; --giz:#f7f4ec; --giz-2:#e9e3d5; --placar:#0f2740;
  --sol:#ffcf3f; --sol-2:#e8b300; --tinta:#15202b; --tinta-2:#4f5e6d; --borda:#d6dde6; --erro:#c62828;
  --f-display:'Lilita One','Arial Black',Impact,sans-serif; --f-body:'Nunito','Segoe UI',Roboto,Arial,sans-serif;
  --sombra:0 12px 32px rgba(15,39,64,.14);
}
*{box-sizing:border-box}
body{margin:0;background:var(--giz);color:var(--tinta);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1{margin:0 0 4px;font:400 clamp(30px,7vw,40px)/1 var(--f-display);color:var(--placar)}
.sub{margin:0 0 20px;color:var(--tinta-2);font-weight:700}
.card{background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:20px 18px}
label{display:block;margin-bottom:6px;font-weight:800;font-size:14px;color:var(--placar)}
input[type=password]{width:100%;min-height:50px;padding:12px 14px;border:2px solid var(--borda);border-radius:12px;font:600 17px var(--f-body);color:var(--tinta)}
input:focus{outline:none;border-color:var(--grama);box-shadow:0 0 0 4px rgba(31,122,60,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:999px;font:800 16px var(--f-body);cursor:pointer;text-decoration:none}
.btn-sol{background:var(--sol);color:var(--placar);box-shadow:0 5px 0 var(--sol-2)}
.btn-leve{background:#fff;color:var(--placar);border:2px solid var(--borda)}
.btn:focus-visible{outline:3px solid var(--grama);outline-offset:3px}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin:10px 0 0;font-weight:700;color:var(--erro);min-height:1.2em}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.barra .sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 16px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--placar);color:#fff;border-radius:14px;padding:14px 14px 12px}
.tile small{display:block;font:800 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.tile b{display:block;margin-top:6px;font:400 36px/1 var(--f-display);color:var(--sol);font-variant-numeric:tabular-nums}
.tile.verde{background:var(--grama)}
.idades{margin:0 0 20px;padding:12px 14px;background:#fff;border-radius:12px;font-size:15px;color:var(--tinta-2)}
.idades b{color:var(--placar)}
h2{margin:22px 0 10px;font:400 22px/1.1 var(--f-display);color:var(--grama-2);letter-spacing:.04em;text-transform:uppercase}
.fam{background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(15,39,64,.08);padding:14px 16px;margin-bottom:10px}
.fam header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:8px}
.fam header b{font-size:17px;color:var(--placar)}
.fam header span{color:var(--tinta-2);font-size:14px;font-weight:700}
.fam header time{margin-left:auto;color:var(--tinta-2);font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--giz);border-radius:999px;font-weight:800;color:var(--placar);font-size:15px}
.chips li small{font-weight:700;color:var(--tinta-2)}
.chips li.nao{background:#fbeaea;color:#8a1c1c}
.obs{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--sol);background:#fffbea;border-radius:0 8px 8px 0;font-size:15px}
.vazio{padding:24px;text-align:center;color:var(--tinta-2);background:#fff;border-radius:14px;font-weight:700}
.copiado{color:var(--grama-2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<script>
const SUPABASE = {
  url: 'https://spldtyrlwczaczljrnkv.supabase.co',
  chave: 'sb_publishable__Tjuatw8jINLHgpDZheduQ_ZTzJbamG',
};
</script>
<div class="wrap">
  <h1>Copa do Theo</h1>
  <p class="sub">Lista de confirmações</p>

  <form id="gate" class="card">
    <label for="senha">Senha da família</label>
    <input type="password" id="senha" autocomplete="current-password" required>
    <p class="msg" id="gateMsg" role="alert"></p>
    <button type="submit" class="btn btn-sol" id="entrar">Ver lista</button>
  </form>

  <section id="painel" hidden>
    <div class="barra">
      <button type="button" class="btn btn-leve" id="atualizar">Atualizar</button>
      <button type="button" class="btn btn-leve" id="copiar">Copiar lista</button>
      <span class="sp"></span>
      <button type="button" class="btn btn-leve" id="sair">Sair</button>
    </div>
    <p class="msg" id="painelMsg" role="status"></p>
    <div class="tiles">
      <div class="tile verde"><small>Crianças confirmadas</small><b id="tConfirmadas">0</b></div>
      <div class="tile"><small>Vão jogar</small><b id="tJogam">0</b></div>
      <div class="tile"><small>Famílias</small><b id="tFamilias">0</b></div>
      <div class="tile"><small>Não vão</small><b id="tNao">0</b></div>
    </div>
    <p class="idades" id="idades" hidden></p>
    <h2>Confirmados</h2>
    <div id="listaSim"></div>
    <h2>Não vão poder ir</h2>
    <div id="listaNao"></div>
  </section>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const headers = { apikey: SUPABASE.chave, Authorization: 'Bearer ' + SUPABASE.chave, 'Content-Type': 'application/json' };
  let senhaAtual = '';
  let dados = [];

  async function listar(senha) {
    const r = await fetch(`${SUPABASE.url}/rest/v1/rpc/listar_confirmacoes`, { method: 'POST', headers, body: JSON.stringify({ senha }) });
    let body = null; try { body = await r.json(); } catch (e) {}
    if (!r.ok) {
      const m = String((body && (body.message || body.details || body.hint)) || '');
      if (/senha/i.test(m) || r.status === 401 || r.status === 403) throw new Error('senha');
      throw new Error('rede');
    }
    return Array.isArray(body) ? body : [];
  }

  const fmtData = iso => {
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  };

  function agrupar(rows) {
    const map = new Map();
    for (const r of rows) {
      const k = r.grupo || r.id;
      if (!map.has(k)) map.set(k, { responsavel: r.responsavel, telefone: r.telefone, observacoes: r.observacoes, criado_em: r.criado_em, vai: r.vai, criancas: [] });
      map.get(k).criancas.push(r);
    }
    return [...map.values()].sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em));
  }

  function render() {
    const sim = dados.filter(r => r.vai), nao = dados.filter(r => !r.vai);
    $('#tConfirmadas').textContent = sim.length;
    $('#tJogam').textContent = sim.filter(r => r.joga_futebol).length;
    $('#tFamilias').textContent = new Set(sim.map(r => r.grupo || r.id)).size;
    $('#tNao').textContent = nao.length;

    const porIdade = new Map();
    sim.forEach(r => { if (r.idade !== null && r.idade !== undefined) porIdade.set(r.idade, (porIdade.get(r.idade) || 0) + 1); });
    const idades = $('#idades');
    if (porIdade.size) {
      const partes = [...porIdade.entries()].sort((a, b) => a[0] - b[0]).map(([i, n]) => `<b>${i} ${i === 1 ? 'ano' : 'anos'}</b> ×${n}`);
      const semIdade = sim.filter(r => r.idade === null || r.idade === undefined).length;
      idades.innerHTML = 'Idades dos confirmados: ' + partes.join(' · ') + (semIdade ? ` · <b>sem idade</b> ×${semIdade}` : '');
      idades.hidden = false;
    } else idades.hidden = true;

    renderLista($('#listaSim'), agrupar(sim), 'Ninguém confirmou ainda.');
    renderLista($('#listaNao'), agrupar(nao), 'Nenhuma resposta negativa.');
  }

  function renderLista(el, familias, vazio) {
    el.innerHTML = '';
    if (!familias.length) { const p = document.createElement('p'); p.className = 'vazio'; p.textContent = vazio; el.append(p); return; }
    for (const f of familias) {
      const art = document.createElement('article'); art.className = 'fam';
      const head = document.createElement('header');
      const b = document.createElement('b'); b.textContent = f.responsavel; head.append(b);
      if (f.telefone) { const s = document.createElement('span'); s.textContent = f.telefone; head.append(s); }
      const t = document.createElement('time'); t.dateTime = f.criado_em; t.textContent = fmtData(f.criado_em); head.append(t);
      art.append(head);
      const ul = document.createElement('ul'); ul.className = 'chips';
      for (const c of f.criancas) {
        const li = document.createElement('li');
        if (!c.vai) li.className = 'nao';
        li.textContent = c.crianca;
        if (c.idade !== null && c.idade !== undefined) { const sm = document.createElement('small'); sm.textContent = `${c.idade} ${c.idade === 1 ? 'ano' : 'anos'}`; li.append(' ', sm); }
        if (c.vai) { const sm = document.createElement('small'); sm.textContent = c.joga_futebol ? '⚽ joga' : 'não joga'; li.append(' · ', sm); }
        ul.append(li);
      }
      art.append(ul);
      if (f.observacoes) { const p = document.createElement('p'); p.className = 'obs'; p.textContent = f.observacoes; art.append(p); }
      el.append(art);
    }
  }

  function textoParaCopiar() {
    const sim = dados.filter(r => r.vai), nao = dados.filter(r => !r.vai);
    const linhas = [`Copa do Theo – confirmações (${new Date().toLocaleString('pt-BR')})`,
      `Crianças confirmadas: ${sim.length} (${sim.filter(r => r.joga_futebol).length} vão jogar)`, ''];
    let i = 0;
    for (const f of agrupar(sim)) for (const c of f.criancas) {
      i += 1;
      linhas.push(`${i}. ${c.crianca}${c.idade != null ? ` (${c.idade})` : ''}${c.joga_futebol ? ' ⚽' : ''} – resp. ${f.responsavel}${f.telefone ? `, ${f.telefone}` : ''}${f.observacoes ? ` – obs: ${f.observacoes}` : ''}`);
    }
    if (nao.length) { linhas.push('', 'Não vão:'); agrupar(nao).forEach(f => linhas.push(`- ${f.criancas.map(c => c.crianca).join(', ')} (${f.responsavel})`)); }
    return linhas.join('\n');
  }

  async function carregar(senha, origem) {
    const msg = origem === 'gate' ? $('#gateMsg') : $('#painelMsg');
    msg.textContent = ''; msg.className = 'msg';
    try {
      dados = await listar(senha);
      senhaAtual = senha;
      try { sessionStorage.setItem('copa-theo-senha', senha); } catch (e) {}
      render();
      $('#gate').hidden = true; $('#painel').hidden = false;
      if (origem !== 'gate') { msg.textContent = 'Lista atualizada.'; msg.className = 'msg copiado'; }
    } catch (e) {
      if (e.message === 'senha') { msg.textContent = 'Senha incorreta.'; if (origem !== 'gate') sair(); $('#gateMsg').textContent = 'Senha incorreta.'; }
      else msg.textContent = 'Não foi possível carregar. Confira a internet e tente de novo.';
    }
  }

  function sair() {
    senhaAtual = ''; dados = [];
    try { sessionStorage.removeItem('copa-theo-senha'); } catch (e) {}
    $('#painel').hidden = true; $('#gate').hidden = false; $('#senha').value = ''; $('#gateMsg').textContent = '';
  }

  $('#gate').addEventListener('submit', async e => {
    e.preventDefault();
    const s = $('#senha').value.trim();
    if (!s) { $('#gateMsg').textContent = 'Digite a senha.'; return; }
    $('#entrar').disabled = true;
    await carregar(s, 'gate');
    $('#entrar').disabled = false;
  });
  $('#atualizar').addEventListener('click', () => carregar(senhaAtual, 'painel'));
  $('#sair').addEventListener('click', sair);
  $('#copiar').addEventListener('click', async () => {
    const texto = textoParaCopiar();
    const msg = $('#painelMsg');
    try { await navigator.clipboard.writeText(texto); msg.textContent = 'Lista copiada. É só colar no WhatsApp.'; msg.className = 'msg copiado'; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = texto; ta.style.cssText = 'position:fixed;left:-9999px'; document.body.append(ta); ta.select();
      try { document.execCommand('copy'); msg.textContent = 'Lista copiada. É só colar no WhatsApp.'; msg.className = 'msg copiado'; } catch (e2) { msg.textContent = 'Não consegui copiar automaticamente.'; }
      ta.remove();
    }
  });

  try {
    const s = sessionStorage.getItem('copa-theo-senha');
    if (s) carregar(s, 'auto');
  } catch (e) {}
})();
</script>
</body>
</html>
